name = "enso"
main = "src/worker/index.ts"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "enso"
database_id = "85c0e2a9-95ef-4cf3-8cea-dceeb2b54773"
# Local dev keeps its own database (its state is keyed by this id), never the production one.
preview_database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# SPEC §7C.3 — thing photos, private: served only through the API (`wrangler r2 bucket create enso-photos`).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "enso-photos"

[assets]
directory = "frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# SPEC §11 M7 — the production address (Q6). The sogodojo.com zone is on this account.
[[routes]]
pattern = "enso.sogodojo.com"
custom_domain = true

# SPEC §2.4 / §9.1 — Web Push. The private key is the secret VAPID_PRIVATE_KEY (never in this file).
# Rotating these keys invalidates every phone's subscription.
[vars]
VAPID_PUBLIC_KEY = "BLeE3RZBJqymlMQlw2Bz7xG-63079wak81SCusCtd17wUA0lOLV-Bb-YDNYek7Ht6Ozrb7y0A0JAcc8e7k-rI-U"
VAPID_SUBJECT = "https://enso.sogodojo.com"
# SPEC §9.2 — House delivery through Cloudflare Tunnel + Access. The secrets HA_TOKEN,
# CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET are set with `wrangler secret put` (never here).
HA_URL = "https://ha.sogodojo.com"
ECHO_TARGETS = ["Game Room", "Kid's Room - Echo", "Sogo", "Toasty"]
ECHO_TYPE = "announce"
SATELLITE_ENTITY = "assist_satellite.home_assistant_voice_09eb97_assist_satellite"
# SPEC §7E.2c — captions from home: SogoAI through the `sogoai` tunnel, behind the same Access service token.
# The bearer CAPTIONS_TOKEN is a secret (`wrangler secret put`, never here).
HOME_CAPTIONS_URL = "https://sogoai.sogodojo.com"
# SPEC §8.18 part 6 — Build now: the "Enso daily feature requests" routine's fire address. Its bearer
# BUILD_FIRE_TOKEN is a secret (`wrangler secret put`, never here); either empty turns Build now off.
BUILD_FIRE_URL = "https://api.anthropic.com/v1/claude_code/routines/trig_01HcWVca5w8nD14G1LXyEYR7/fire"
# SPEC §7.11 — the daily forecast on the calendar (free, no key). Empty turns weather off.
WEATHER_URL = "https://api.open-meteo.com"
# SPEC §7.14 — good fishing times: tides (NOAA CO-OPS) and waves (Open-Meteo marine), free, no key. Empty turns them off.
TIDES_URL = "https://api.tidesandcurrents.noaa.gov"
MARINE_URL = "https://marine-api.open-meteo.com"
# SPEC §7.14b — fish events: the CDFW trout plants in San Diego County (ds2897, GeoJSON) and the county parks' calendar.
FISH_PLANTS_URL = "https://services2.arcgis.com/Uq9r85Potqm3MfRV/arcgis/rest/services/biosds2897_fmu/FeatureServer/0/query?where=Counties%20LIKE%20%27%25San%20Diego%25%27&outFields=WaterName,WeekOfPlantStart,FishType,Lat,Lon,OBJECTID&orderByFields=WeekOfPlantStart%20DESC&outSR=4326&f=geojson"
PARKS_ICAL_URL = "https://tockify.com/api/feeds/ics/sdparkscalendar"

[triggers]
crons = ["* * * * *"]

[ai]
binding = "AI"
